name = "tourgroupweb"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "tourgroup"
database_id = "abd5cbd3-ff4d-4932-84c3-7e0624e71332"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "Bucket"
bucket_name = "tourgroup-images"

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "1001" # Unikt positivt heltal — vælg dit eget, må ikke være i citationstegn

  [ratelimits.simple]
  limit = 10       # Tillad 10 forsøg...
  period = 60      # ...inden for 60 sekunder
